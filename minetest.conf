# Default world settings for Terrarium Crucible
mg_name = singlenode
enable_damage = true
creative_mode = false
default_privs = interact, shout
time_speed = 0
time_of_day = 0.8
static_spawnpoint = 0, 1.5, -2.8
server_announce = false

