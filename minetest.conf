# ============================================================================
# Terrarium Crucible — Default Game & Engine Settings (Luanti 5.18+)
# ============================================================================

# --- World, Lighting & Co-op Rules ---
mg_name = singlenode
enable_damage = true
creative_mode = false
enable_pvp = false
default_privs = interact, shout
time_speed = 0
world_start_time = 1000
static_spawnpoint = 0, 1.5, -2.8
server_announce = false
max_users = 8
item_entity_ttl = 120

# --- Graphics, Glass Terrarium & UI Polish ---
inventory_items_animations = true
connected_glass = true
enable_post_processing = true
enable_bloom = true
enable_minimap = false
tooltip_show_delay = 200
formspec_fullscreen_bg_opacity = 175
formspec_fullscreen_bg_color = (10,8,18)
show_wielded_item_y_offset = 108

# --- Multiplayer 20 TPS Physics & Responsive Water Flow ---
dedicated_server_step = 0.05
liquid_update = 0.4
anticheat_movement_tolerance = 2.0

# --- Character Model, Held Tools, Potion Drinking, Sprint & Emotes ---
x_player_api.model_format = glb
x_player_api.enable_wield_item = true
x_player_api.enable_left_wield_first_person = true
x_player_api.enable_eating = true
x_player_api.enable_equip_sound = true
x_player_api.enable_head_tracking = true
x_player_api.enable_emote_chatcommands = true
x_player_api.enable_double_tap_sprint = true
x_player_api.enable_aux1_sprint = true
